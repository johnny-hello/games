<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Shape Defender</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f3f0ff; color: #333; font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh; user-select: none; -webkit-user-select: none; padding: 0 12px 20px; }
  h1 { margin: 12px 0 4px; font-size: 28px; }
  #hud { width: 100%; max-width: 820px; display: flex; justify-content: space-between; font-size: 20px; font-weight: bold; }
  #ask { font-size: 26px; font-weight: bold; min-height: 40px; margin: 8px 0; text-align: center; }
  #field { position: relative; width: 100%; max-width: 820px; height: 240px; background: linear-gradient(#d0ebff 0 60%, #8ce99a 60%); border: 3px solid #333; border-radius: 14px; overflow: hidden; }
  #castle { position: absolute; left: 4px; bottom: 30px; font-size: 70px; }
  .mon { position: absolute; bottom: 40px; width: 74px; height: 74px; cursor: pointer; transition: opacity 0.3s, transform 0.3s; }
  .mon.front { filter: drop-shadow(0 0 6px #f03e3e); }
  .mon.pop { opacity: 0; transform: scale(1.8); }
  .mon.bad { animation: shake 0.3s; }
  @keyframes shake { 25% { translate: -5px; } 75% { translate: 5px; } }
  #choices { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; max-width: 820px; }
  button { font-family: inherit; font-size: 22px; font-weight: bold; padding: 10px 16px; border: 3px solid #333; border-radius: 14px; background: #ffe066; cursor: pointer; }
  button:active { transform: scale(0.95); }
  button.wrong { background: #ff8787; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; padding: 12px; z-index: 5; }
  #overlay.show { display: flex; }
  #box { background: #fff; border: 4px solid #333; border-radius: 18px; padding: 18px; text-align: center; max-width: 500px; }
  a.home { color: #1971c2; font-size: 16px; margin-top: 14px; }
</style>
</head>
<body>
<h1>🏰 Shape Defender</h1>
<div id="hud"><span id="wave">Wave 1</span><span id="hearts">❤️❤️❤️❤️❤️</span><span id="score">⭐ 0</span></div>
<div id="ask"></div>
<div id="field"><div id="castle">🏰</div></div>
<div id="choices"></div>
<a class="home" href="../index.html">← All games</a>
<div id="overlay"><div id="box"></div></div>

<script>
var $ = function (i) { return document.getElementById(i); };
function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(a) { return a[rnd(0, a.length - 1)]; }
function poly(n, r, rot) { var p = []; for (var i = 0; i < n; i++) { var a = (rot || -Math.PI / 2) + i * 2 * Math.PI / n; p.push((50 + r * Math.cos(a)).toFixed(1) + "," + (50 + r * Math.sin(a)).toFixed(1)); } return "<polygon points='" + p.join(" ") + "'/>"; }
// sides: number of straight sides (0 = curved). eq: all sides equal. right: number of right angles
var SHAPES = {
  circle:    { svg: "<circle cx='50' cy='50' r='42'/>", sides: 0, eq: false, right: 0, color: "#ff8787" },
  triangle:  { svg: poly(3, 46), sides: 3, eq: true, right: 0, color: "#ffa94d" },
  square:    { svg: "<rect x='12' y='12' width='76' height='76'/>", sides: 4, eq: true, right: 4, color: "#74c0fc" },
  rectangle: { svg: "<rect x='4' y='26' width='92' height='50'/>", sides: 4, eq: false, right: 4, color: "#63e6be" },
  pentagon:  { svg: poly(5, 46), sides: 5, eq: true, right: 0, color: "#b197fc" },
  hexagon:   { svg: poly(6, 46, 0), sides: 6, eq: true, right: 0, color: "#ffd43b" },
  octagon:   { svg: poly(8, 46, Math.PI / 8), sides: 8, eq: true, right: 0, color: "#f783ac" },
  rhombus:   { svg: "<polygon points='50,4 84,50 50,96 16,50'/>", sides: 4, eq: true, right: 0, color: "#a9e34b" },
  oval:      { svg: "<ellipse cx='50' cy='50' rx='46' ry='30'/>", sides: 0, eq: false, right: 0, color: "#e599f7" },
  "right triangle": { svg: "<polygon points='10,90 90,90 10,15'/>", sides: 3, eq: false, right: 1, color: "#ffc078" }
};
var PROPS = [
  ["has 3 sides", function (s) { return s.sides === 3; }],
  ["has 4 sides", function (s) { return s.sides === 4; }],
  ["has 5 corners", function (s) { return s.sides === 5; }],
  ["has 6 sides", function (s) { return s.sides === 6; }],
  ["has 8 sides", function (s) { return s.sides === 8; }],
  ["has NO corners", function (s) { return s.sides === 0; }],
  ["has 4 EQUAL sides", function (s) { return s.sides === 4 && s.eq; }],
  ["has 4 right angles ∟", function (s) { return s.right === 4; }],
  ["has a right angle ∟", function (s) { return s.right > 0; }],
  ["has sides that are NOT all equal", function (s) { return s.sides > 0 && !s.eq; }]
];
// waves: which shapes, mode ("name" = tap the name, "prop" = tap the monster)
var WAVES = [
  { shapes: ["circle", "triangle", "square"], mode: "name" },
  { shapes: ["circle", "triangle", "square", "rectangle"], mode: "name" },
  { shapes: ["triangle", "square", "rectangle", "pentagon", "hexagon"], mode: "name" },
  { shapes: ["circle", "oval", "pentagon", "hexagon", "octagon", "rhombus"], mode: "name" },
  { shapes: ["triangle", "square", "pentagon", "hexagon", "circle"], mode: "prop" },
  { shapes: ["square", "rectangle", "rhombus", "triangle", "octagon", "oval"], mode: "prop" },
  { shapes: Object.keys(SHAPES), mode: "prop" },
  { shapes: Object.keys(SHAPES), mode: "mix" }
];
var PER_WAVE = 8;
var wave, hearts, score, killed, mons, last, spawnT, running, prop, mode, raf;

function begin() { wave = 0; hearts = 5; score = 0; hide(); startWave(); }
function startWave() {
  killed = 0; spawned = 0; mons.forEach(function (m) { m.el.remove(); }); mons = []; spawnT = 0; prop = null;
  $("wave").textContent = "Wave " + (wave + 1) + " / " + WAVES.length;
  running = true; last = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
  refresh();
}
var spawned = 0; mons = [];
function speed() { return 22 + wave * 5; } // px per second
function spawn() {
  if (spawned >= PER_WAVE) return;
  spawned++;
  var name = pick(WAVES[wave].shapes), s = SHAPES[name], el = document.createElement("div");
  el.className = "mon";
  el.innerHTML = "<svg viewBox='-4 -4 108 108' width='74' height='74'><g fill='" + s.color + "' stroke='#333' stroke-width='4'>" + s.svg + "</g>" +
    "<circle cx='38' cy='48' r='7' fill='#fff' stroke='#333' stroke-width='2'/><circle cx='62' cy='48' r='7' fill='#fff' stroke='#333' stroke-width='2'/><circle cx='39' cy='49' r='3'/><circle cx='63' cy='49' r='3'/></svg>";
  var m = { name: name, x: $("field").clientWidth, el: el, dead: false };
  el.onclick = function () { tapMon(m); };
  $("field").appendChild(el); mons.push(m);
  refresh();
}
function alive() { return mons.filter(function (m) { return !m.dead; }); }
function front() { var a = alive(); a.sort(function (p, q) { return p.x - q.x; }); return a[0]; }

function refresh() {
  var w = WAVES[wave], f = front(), c = $("choices");
  mons.forEach(function (m) { m.el.classList.toggle("front", m === f && mode === "name"); });
  if (!f) { c.innerHTML = ""; $("ask").textContent = "Here they come…"; return; }
  mode = w.mode === "mix" ? (prop ? "prop" : (Math.random() < 0.5 ? "prop" : "name")) : w.mode;
  if (mode === "name") {
    prop = null;
    $("ask").textContent = "What is the glowing monster's name?";
    if (c.dataset.for === f.name + spawned) return;
    var opts = [f.name]; while (opts.length < 4) { var o = pick(Object.keys(SHAPES)); if (opts.indexOf(o) < 0) opts.push(o); }
    opts.sort(function () { return Math.random() - 0.5; });
    c.innerHTML = ""; c.dataset.for = f.name + spawned;
    opts.forEach(function (o) { var b = document.createElement("button"); b.textContent = o; b.onclick = function () { tapName(o, b); }; c.appendChild(b); });
  } else {
    c.innerHTML = ""; c.dataset.for = "";
    if (!prop || !alive().some(function (m) { return prop[1](SHAPES[m.name]); })) {
      var ok = PROPS.filter(function (p) { return alive().some(function (m) { return p[1](SHAPES[m.name]); }); });
      prop = pick(ok);
    }
    $("ask").innerHTML = "Tap the monster that <u>" + prop[0] + "</u>!";
    mons.forEach(function (m) { m.el.classList.remove("front"); });
  }
}
function kill(m) {
  m.dead = true; m.el.classList.add("pop"); setTimeout(function () { m.el.remove(); }, 300);
  score++; killed++; $("score").textContent = "⭐ " + score; prop = null;
  if (killed >= PER_WAVE) return waveDone();
  if (!alive().length) spawnT = 99; // bring the next one quickly
  refresh();
}
function tapName(o, b) {
  if (!running) return; var f = front();
  if (f && o === f.name) kill(f);
  else { b.classList.add("wrong"); f && (f.x -= 30); setTimeout(function () { b.classList.remove("wrong"); }, 400); }
}
function tapMon(m) {
  if (!running || m.dead || mode !== "prop") return;
  if (prop[1](SHAPES[m.name])) kill(m);
  else { m.el.classList.remove("bad"); void m.el.offsetWidth; m.el.classList.add("bad"); m.x -= 30; $("ask").innerHTML = "That's a <b>" + m.name + "</b>. Find the one that <u>" + prop[0] + "</u>!"; }
}
function loop(t) {
  if (!running) return;
  var dt = Math.min(0.05, (t - last) / 1000); last = t;
  spawnT += dt;
  var gap = Math.max(2.2, 5 - wave * 0.4);
  if (spawnT > gap || (spawnT > 0.5 && !alive().length)) { spawnT = 0; spawn(); }
  mons.forEach(function (m) {
    if (m.dead) return;
    m.x -= speed() * dt; m.el.style.left = m.x + "px";
    if (m.x < 70) {
      m.dead = true; m.el.classList.add("pop"); setTimeout(function () { m.el.remove(); }, 300);
      hearts--; killed++; $("hearts").textContent = "❤️".repeat(Math.max(0, hearts)) + "🤍".repeat(5 - Math.max(0, hearts));
      $("ask").textContent = "Ouch! A " + m.name + " reached the castle!";
      if (hearts <= 0) return over();
      if (killed >= PER_WAVE) return waveDone();
      prop = null; refresh();
    }
  });
  if (running) raf = requestAnimationFrame(loop);
}
function waveDone() {
  running = false;
  if (wave === WAVES.length - 1) return show("<h2>🏆 The castle is safe!</h2><p style='font-size:20px'>You beat every wave with ⭐ " + score + "</p><button onclick='begin()'>Play again</button>");
  show("<h2>🎉 Wave " + (wave + 1) + " cleared!</h2><p style='font-size:19px'>" + (WAVES[wave + 1].mode === "name" ? "New shapes are coming!" : "Next: tap the monster that matches the clue!") + "</p><button onclick='hide();wave++;startWave()'>Next wave ▶</button>");
}
function over() {
  running = false;
  show("<h2>💥 The castle fell!</h2><p style='font-size:20px'>You reached wave " + (wave + 1) + " with ⭐ " + score + "</p><button onclick='begin()'>Try again</button>");
}
function show(h) { $("box").innerHTML = h; $("overlay").classList.add("show"); }
function hide() { $("overlay").classList.remove("show"); }
show("<h2>🏰 Shape Defender</h2><p style='font-size:19px'>Shape monsters are coming! Stop each one by naming it, or by tapping the shape that matches the clue.</p><button onclick='begin()'>Defend!</button>");
</script>
</body>
</html>
