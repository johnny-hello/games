<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Dice Adventure</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff9db; color: #333; font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 0 12px 24px; }
  h1 { margin: 12px 0 4px; font-size: 28px; }
  .hint { color: #777; font-size: 17px; text-align: center; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 8px 0; }
  button { font-family: inherit; font-size: 20px; font-weight: bold; padding: 8px 14px; border: 3px solid #333; border-radius: 14px; background: #ffe066; cursor: pointer; }
  button:active { transform: scale(0.95); }
  button.go { background: #8ce99a; } button.blue { background: #74c0fc; } button.on { background: #ff922b; }
  .die { width: 96px; height: 116px; background: #fff; border: 3px solid #333; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
  .die .e { font-size: 52px; } .die .w { font-size: 15px; font-weight: bold; }
  .die.roll { animation: roll 0.5s; }
  @keyframes roll { 50% { transform: rotate(180deg) scale(0.7); } }
  .page { width: 100%; max-width: 680px; background: #fff; border: 3px solid #333; border-radius: 16px; padding: 10px; margin: 8px 0; display: flex; gap: 10px; align-items: flex-start; }
  .page .pic { font-size: 54px; line-height: 1; text-align: center; min-width: 70px; }
  .page .pic small { display: block; font-size: 13px; }
  .page textarea { flex: 1; font-family: inherit; font-size: 19px; min-height: 80px; border: 2px solid #aaa; border-radius: 10px; padding: 6px; resize: vertical; }
  .page .side { display: flex; flex-direction: column; gap: 6px; }
  .page .side button { font-size: 18px; padding: 4px 8px; }
  .used { color: #2b8a3e; font-size: 14px; }
  input { font-family: inherit; font-size: 20px; padding: 6px 10px; border: 2px solid #aaa; border-radius: 10px; }
  #book { display: none; width: 100%; max-width: 680px; }
  .bookpage { background: #fff; border: 4px solid #845ef7; border-radius: 18px; padding: 24px; text-align: center; min-height: 320px; display: flex; flex-direction: column; justify-content: center; }
  .bookpage .big { font-size: 110px; }
  .bookpage p { font-size: 24px; }
  .hide { display: none !important; }
  a.home { color: #1971c2; font-size: 16px; margin-top: 14px; }
  @media print { button, .row, a.home, h1, .hint { display: none !important; } .bookpage { page-break-after: always; border: none; } }
</style>
</head>
<body>
<h1>📖 Story Dice Adventure</h1>

<div id="make">
  <p class="hint">Roll the dice, then write (or say 🎤) one part of your story for each picture!</p>
  <div class="row">
    <span style="font-size:20px;align-self:center">Dice:</span>
    <button data-n="3">3</button><button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button>
    <button class="go" id="rollBtn">🎲 Roll!</button>
  </div>
  <div class="row" id="dice"></div>
  <p class="hint">Tap one die to roll just that one again.</p>
  <div id="pages"></div>
  <div class="row"><input id="title" placeholder="Story title" maxlength="60"><input id="author" placeholder="Written by…" maxlength="40"></div>
  <div class="row"><button class="go" id="bookBtn">📚 Make my book!</button><button class="blue" id="libBtn">🗂 My books</button></div>
  <p class="hint" id="msg"></p>
</div>

<div id="book">
  <div id="bookPage"></div>
  <div class="row">
    <button id="prevBtn">◀</button><span id="pageNum" style="font-size:20px;align-self:center"></span><button id="nextBtn">▶</button>
  </div>
  <div class="row">
    <button class="blue" id="editBtn">✏️ Edit</button><button class="go" id="dlBtn">💾 Save file</button><button id="printBtn">🖨 Print</button><button id="newBtn">🎲 New story</button>
  </div>
</div>
<div id="lib" class="hide" style="width:100%;max-width:680px"></div>
<a class="home" href="../">← All games</a>

<script>
var $ = function (i) { return document.getElementById(i); };
var PICS = [["🐉","dragon"],["🌋","volcano"],["🔑","key"],["🎂","cake"],["🏰","castle"],["🚀","rocket"],["🐙","octopus"],["🌈","rainbow"],["🧙","wizard"],["🦖","dinosaur"],["🗺️","map"],["💎","treasure"],["🌙","moon"],["🐶","puppy"],["🎈","balloon"],["🏴‍☠️","pirates"],["🌲","forest"],["🤖","robot"],["👑","crown"],["🐢","turtle"],["⚡","lightning"],["🧁","cupcake"],["🦄","unicorn"],["🌊","ocean"],["🎩","magic hat"],["👻","ghost"],["🚂","train"],["🍄","mushroom"],["🦉","owl"],["❄️","snow"],["🏝️","island"],["🕷️","spider"],["🎁","present"],["🐝","bee"],["🔭","telescope"],["🧸","teddy bear"]];
var STARTERS = ["Once upon a time…", "Next…", "Suddenly…", "Then…", "After that…", "In the end…"];
var count = 4, dice = [], texts = [], bookIdx = 0;
var lib = []; try { lib = JSON.parse(localStorage.getItem("storyBooks")) || []; } catch (e) {}

function randPic(except) { var p; do { p = PICS[Math.floor(Math.random() * PICS.length)]; } while (except.indexOf(p) >= 0); return p; }
function setCount(n) { count = n; document.querySelectorAll("[data-n]").forEach(function (b) { b.classList.toggle("on", +b.dataset.n === n); }); }
document.querySelectorAll("[data-n]").forEach(function (b) { b.onclick = function () { setCount(+b.dataset.n); roll(); }; });

function roll() {
  saveTexts(); dice = [];
  for (var i = 0; i < count; i++) dice.push(randPic(dice));
  texts = texts.slice(0, count);
  drawDice(true); drawPages();
}
function rollOne(i) { saveTexts(); dice[i] = randPic(dice); drawDice(false, i); drawPages(); }
function drawDice(all, one) {
  var d = $("dice"); d.innerHTML = "";
  dice.forEach(function (p, i) {
    var el = document.createElement("div"); el.className = "die" + (all || one === i ? " roll" : "");
    el.innerHTML = "<span class='e'>" + p[0] + "</span><span class='w'>" + p[1] + "</span>";
    el.onclick = function () { rollOne(i); }; d.appendChild(el);
  });
}
function drawPages() {
  var c = $("pages"); c.innerHTML = "";
  dice.forEach(function (p, i) {
    var pg = document.createElement("div"); pg.className = "page";
    pg.innerHTML = "<div class='pic'>" + p[0] + "<small>" + p[1] + "</small></div><textarea placeholder='" + STARTERS[Math.min(i, STARTERS.length - 1)] + " (use the word “" + p[1] + "”)'></textarea>" +
      "<div class='side'>" + (speechOK ? "<button title='Say it'>🎤</button>" : "") + "<span class='used'></span></div>";
    var ta = pg.querySelector("textarea"); ta.value = texts[i] || "";
    ta.oninput = function () { texts[i] = ta.value; checkWord(pg, ta, p); };
    checkWord(pg, ta, p);
    var mic = pg.querySelector("button"); if (mic) mic.onclick = function () { listen(ta, mic, i, pg, p); };
    c.appendChild(pg);
  });
}
function checkWord(pg, ta, p) { pg.querySelector(".used").textContent = ta.value.toLowerCase().indexOf(p[1].split(" ")[0]) >= 0 ? "✅ used “" + p[1] + "”" : ""; }
function saveTexts() { document.querySelectorAll("#pages textarea").forEach(function (t, i) { texts[i] = t.value; }); }

// Speech to text (works in Chrome/Safari when allowed)
var SR = window.SpeechRecognition || window.webkitSpeechRecognition, speechOK = !!SR;
function listen(ta, btn, i, pg, p) {
  var r = new SR(); r.lang = "en-US"; r.interimResults = false;
  btn.textContent = "👂"; r.onresult = function (e) { var t = e.results[0][0].transcript; ta.value = (ta.value ? ta.value + " " : "") + t; texts[i] = ta.value; checkWord(pg, ta, p); };
  r.onend = function () { btn.textContent = "🎤"; }; r.onerror = function () { btn.textContent = "🎤"; $("msg").textContent = "The microphone isn't available. You can type instead!"; };
  r.start();
}

function current() {
  saveTexts();
  return { title: $("title").value.trim() || "My Story", author: $("author").value.trim(), pages: dice.map(function (p, i) { return { pic: p[0], word: p[1], text: (texts[i] || "").trim() }; }), date: new Date().toLocaleDateString() };
}
var book;
function makeBook() {
  var b = current(), empty = b.pages.filter(function (p) { return !p.text; }).length;
  if (empty) { $("msg").textContent = "✏️ Write something for every picture first! (" + empty + " left)"; return; }
  $("msg").textContent = "";
  book = b; lib = lib.filter(function (x) { return x.title !== b.title; }); lib.unshift(b); lib = lib.slice(0, 20);
  try { localStorage.setItem("storyBooks", JSON.stringify(lib)); } catch (e) {}
  openBook(b);
}
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; }); }
function pageHTML(b, i) {
  if (i === 0) return "<div class='bookpage'><div class='big'>" + b.pages.map(function (p) { return p.pic; }).join("") + "</div><h2 style='font-size:36px;margin:8px'>" + esc(b.title) + "</h2><p>" + (b.author ? "by " + esc(b.author) : "") + "</p></div>";
  var p = b.pages[i - 1];
  return "<div class='bookpage'><div class='big'>" + p.pic + "</div><p>" + esc(p.text) + "</p></div>";
}
function openBook(b) { book = b; bookIdx = 0; $("make").style.display = "none"; $("lib").classList.add("hide"); $("book").style.display = "block"; showPage(); }
function showPage() {
  $("bookPage").innerHTML = pageHTML(book, bookIdx);
  $("pageNum").textContent = bookIdx === 0 ? "Cover" : "Page " + bookIdx + " / " + book.pages.length;
  $("prevBtn").disabled = bookIdx === 0; $("nextBtn").disabled = bookIdx === book.pages.length;
}
$("prevBtn").onclick = function () { bookIdx--; showPage(); };
$("nextBtn").onclick = function () { bookIdx++; showPage(); };
$("editBtn").onclick = function () {
  $("title").value = book.title; $("author").value = book.author;
  dice = book.pages.map(function (p) { return PICS.filter(function (q) { return q[0] === p.pic; })[0] || [p.pic, p.word]; });
  texts = book.pages.map(function (p) { return p.text; }); setCount(dice.length);
  $("book").style.display = "none"; $("make").style.display = "block"; drawDice(false); drawPages();
};
$("newBtn").onclick = function () { texts = []; $("title").value = ""; $("book").style.display = "none"; $("make").style.display = "block"; roll(); };
$("printBtn").onclick = function () {
  var all = ""; for (var i = 0; i <= book.pages.length; i++) all += pageHTML(book, i);
  $("bookPage").innerHTML = all; window.print(); showPage();
};
$("dlBtn").onclick = function () {
  var pages = ""; for (var i = 0; i <= book.pages.length; i++) pages += pageHTML(book, i);
  var html = "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>" + esc(book.title) + "</title><style>body{font-family:'Comic Sans MS',sans-serif;background:#fff9db;max-width:680px;margin:auto;padding:12px}.bookpage{background:#fff;border:4px solid #845ef7;border-radius:18px;padding:24px;text-align:center;margin:16px 0}.big{font-size:110px}p{font-size:24px}</style></head><body>" + pages + "</body></html>";
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
  a.download = (book.title.replace(/[^\w ]/g, "").trim() || "my-story") + ".html"; a.click();
};
$("libBtn").onclick = function () {
  var l = $("lib");
  if (!lib.length) { $("msg").textContent = "No books yet. Make your first one!"; return; }
  l.innerHTML = "<h2>🗂 My books</h2>" + lib.map(function (b, i) { return "<div class='row' style='justify-content:space-between'><button class='blue' style='flex:1;text-align:left' data-open='" + i + "'>" + b.pages.map(function (p) { return p.pic; }).join("") + " " + esc(b.title) + "</button><button data-del='" + i + "'>🗑</button></div>"; }).join("") + "<button onclick=\"document.getElementById('lib').classList.add('hide')\">Close</button>";
  l.classList.remove("hide");
  l.querySelectorAll("[data-open]").forEach(function (b) { b.onclick = function () { openBook(lib[+b.dataset.open]); }; });
  l.querySelectorAll("[data-del]").forEach(function (b) { b.onclick = function () { if (confirm("Delete this book?")) { lib.splice(+b.dataset.del, 1); try { localStorage.setItem("storyBooks", JSON.stringify(lib)); } catch (e) {} $("libBtn").onclick(); } }; });
};
$("rollBtn").onclick = roll;
$("bookBtn").onclick = makeBook;
setCount(4); roll();
</script>
</body>
</html>
